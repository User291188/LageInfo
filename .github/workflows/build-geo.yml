name: Build local geo layers
on:
  push:
    paths:
      - 'scripts/build_geo.py'
      - '.github/workflows/build-geo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: python scripts/build_geo.py
      - name: Commit generated layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson
          git diff --cached --quiet || git commit -m "Generate local geo layers"
          git push
