name: Build local geo layers

on:
  push:
    paths:
      - 'scripts/build_geo.py'
      - '.github/workflows/build-geo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-local-geo-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install shapely brotli
      - run: python scripts/build_geo.py

      - name: Commit generated layers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson

          if git diff --cached --quiet; then
            echo "No geo layer changes to commit."
            exit 0
          fi

          git commit -m "Generate local geo layers"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
