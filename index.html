<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LageInfo</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div><div class="brand">LAGEINFO <span>● LIVE</span></div><div class="sub">Öffentliche Lageinformationen · Prototyp</div></div><div id="clock"></div></header>
<nav class="tabs"><button class="active" data-view="de">Deutschland</button><button data-view="world">Weltlage</button><button data-view="air">Luftlage</button></nav>
<main>
<section class="map-panel"><div id="map"></div><div class="layers"><strong>Layer</strong><label><input type="checkbox" data-layer="police" checked> Polizei / Presse</label><label><input type="checkbox" data-layer="warn" checked> Warnungen</label><label><input type="checkbox" data-layer="missions" checked> Einsatzregionen</label><label><input type="checkbox" data-layer="quakes"> Erdbeben</label><label><input type="checkbox" data-layer="fires"> Brände</label><label><input type="checkbox" data-layer="air"> Luftlage</label></div></section>
<aside class="side"><div class="side-head"><h2>Relevante Meldungen</h2><span id="count"></span></div><input id="search" autocomplete="off" placeholder="Schlagwort filtern …"><div class="chips"><button>Bundeswehr</button><button>Demonstration</button><button>Gelöbnis</button><button>Drohne</button><button>Rakete</button></div><div id="feed"></div></aside>
</main>
<footer>Modular vorgesehen: Presseportal/RSS · NINA/BBK · GDELT · USGS · NASA FIRMS · Open-Meteo · ADS-B · CelesTrak · AIS</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
