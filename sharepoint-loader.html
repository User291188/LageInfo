<script type="text/javascript">
(function () {
    var APP = "/arbeitsbereiche/A5604057339/LAB_Apps/LageInfo/";
    var INDEX = APP + "index.html";

    if (window.location.search.toLowerCase().indexOf("sharepoint1") !== -1) {
        console.log("LageInfo: SharePoint1 aktiv");
        return;
    }

    window.LAGEINFO_APP_BASE = APP.replace(/\/$/, "");

    function abs(path) {
        if (/^https?:\/\//i.test(path) || path.indexOf("//") === 0 || path.charAt(0) === "/") return path;
        return APP + path;
    }

    function fetchText(path, allowHtml) {
        var target = abs(path);
        var bust = target + (target.indexOf("?") >= 0 ? "&" : "?") + "lageinfo=" + Date.now();
        return fetch(bust, { credentials: "same-origin", cache: "no-store" })
            .then(function (r) {
                if (!r.ok) throw new Error(path + " HTTP " + r.status);
                return r.text();
            })
            .then(function (text) {
                if (!allowHtml && /^\s*(?:<!doctype\s+html|<html\b)/i.test(text)) {
                    throw new Error(path + " liefert HTML statt der erwarteten Datei");
                }
                return text;
            });
    }

    function fetchFirst(paths, allowHtml) {
        var errors = [];
        function next(i) {
            if (i >= paths.length) {
                throw new Error("Keine der Dateien gefunden: " + paths.join(", ") + (errors.length ? " | " + errors.join(" | ") : ""));
            }
            return fetchText(paths[i], allowHtml)
                .then(function (text) { return { path: paths[i], text: text }; })
                .catch(function (e) {
                    errors.push(e.message || String(e));
                    return next(i + 1);
                });
        }
        return next(0);
    }

    function cssUrls(css, base) {
        return css.replace(/url\(\s*(['"]?)(?!data:|https?:|\/\/|\/)([^'")]+)\1\s*\)/gi,
            function (_, q, rel) {
                return 'url("' + base + rel + '")';
            });
    }

    function dirname(path) {
        var i = path.lastIndexOf("/");
        return i >= 0 ? path.substring(0, i + 1) : "";
    }

    function loadStyle(path, assetBase) {
        return fetchText(path, false).then(function (css) {
            var style = document.createElement("style");
            style.type = "text/css";
            style.setAttribute("data-lageinfo-style", path);
            style.textContent = cssUrls(css, assetBase || APP);
            document.head.appendChild(style);
            console.log("LageInfo CSS OK:", path);
        });
    }

    function loadStyleFirst(paths, optional) {
        return fetchFirst(paths, false).then(function (result) {
            var style = document.createElement("style");
            var base = APP + dirname(result.path);
            style.type = "text/css";
            style.setAttribute("data-lageinfo-style", result.path);
            style.textContent = cssUrls(result.text, base);
            document.head.appendChild(style);
            console.log("LageInfo CSS OK:", result.path);
            return result.path;
        }).catch(function (e) {
            if (optional) {
                console.warn("LageInfo: optionale CSS-Datei nicht gefunden:", e.message || e);
                return null;
            }
            throw e;
        });
    }

    function executeCode(code, path, isolateAmd) {
        var script = document.createElement("script");
        script.type = "text/javascript";
        script.setAttribute("data-lageinfo-script", path);
        if (isolateAmd) {
            script.text = "(function(define,module,exports){\n" + code + "\n}).call(window,undefined,undefined,undefined);\n//# sourceURL=" + abs(path);
        } else {
            script.text = code + "\n//# sourceURL=" + abs(path);
        }
        document.head.appendChild(script);
        console.log("LageInfo JS OK:", path);
    }

    function runScript(path, isolateAmd) {
        return fetchText(path, false).then(function (code) {
            executeCode(code, path, isolateAmd);
        });
    }

    function runOptionalScript(path, isolateAmd) {
        return runScript(path, isolateAmd).catch(function (e) {
            console.warn("LageInfo: optionales Modul nicht geladen:", path, e.message || e);
            return null;
        });
    }

    function runFirstScript(paths, isolateAmd) {
        return fetchFirst(paths, false).then(function (result) {
            executeCode(result.text, result.path, isolateAmd);
            return result.path;
        });
    }

    function showError(error) {
        console.error("LageInfo STARTFEHLER:", error);
        var host = document.getElementById("lageinfo-sharepoint-host");
        if (!host) {
            host = document.createElement("div");
            host.id = "lageinfo-sharepoint-host";
            document.body.appendChild(host);
        }
        host.style.cssText = "position:fixed;inset:0;z-index:999999;background:#07151d;color:#fff;overflow:auto;";
        host.innerHTML = '<div style="margin:0;padding:42px;font-family:Segoe UI,Arial;background:#661f2d;">' +
            '<h2 style="margin-top:0">LageInfo konnte nicht gestartet werden</h2>' +
            '<p>' + String(error && (error.message || error)) + '</p>' +
            '<p style="opacity:.8">Die originale SharePoint-Seite erreichst du mit ?sharepoint1</p>' +
            '</div>';
    }

    var LEAFLET_CSS = [
        "vendor/leaflet/leaflet.css",
        "vendor/leaflet/dist/leaflet.css",
        "vendor/leaflet.css",
        "leaflet/leaflet.css",
        "dist/leaflet.css",
        "leaflet.css"
    ];

    var LEAFLET_JS = [
        "vendor/leaflet/leaflet.js",
        "vendor/leaflet/dist/leaflet.js",
        "vendor/leaflet.js",
        "leaflet/leaflet.js",
        "dist/leaflet.js",
        "leaflet.js"
    ];

    fetchText(INDEX, true)
        .then(function (html) {
            var page = new DOMParser().parseFromString(html, "text/html");
            Array.prototype.forEach.call(page.querySelectorAll("script,link[rel=stylesheet]"), function (n) { n.remove(); });

            var old = document.getElementById("lageinfo-sharepoint-host");
            if (old) old.remove();

            var host = document.createElement("div");
            host.id = "lageinfo-sharepoint-host";
            host.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;z-index:999999;background:#07151d;overflow:hidden;";
            host.innerHTML = page.body.innerHTML;
            document.body.appendChild(host);
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";

            return loadStyleFirst(LEAFLET_CSS, true)
                .then(function () { return loadStyle("style.css", APP); });
        })
        .then(function () { return runFirstScript(LEAFLET_JS, true); })
        .then(function (leafletPath) {
            if (!window.L) throw new Error("Leaflet wurde aus " + leafletPath + " ausgeführt, aber window.L fehlt");
            console.log("LageInfo Leaflet OK:", window.L.version || "geladen");
            return runScript("config.js");
        })
        .then(function () { return runScript("modules/live-data.js"); })
        .then(function () { return runScript("modules/security-engine.js"); })
        .then(function () { return runScript("modules/geo-layers.js"); })
        .then(function () { return runOptionalScript("modules/sharepoint-incidents.js"); })
        .then(function () { return runScript("app.js"); })
        .then(function () {
            if (window.LageIncidents && window.LageIncidents.init) window.LageIncidents.init();

            var lp = document.getElementById("layerPanel"), lt = document.getElementById("layerToggle");
            if (lp && lt) lt.onclick = function () {
                lp.classList.toggle("collapsed");
                this.textContent = lp.classList.contains("collapsed") ? "›" : "‹";
            };

            var ml = document.getElementById("mainLayout"), rp = document.getElementById("reportPanel"), rt = document.getElementById("reportToggle");
            if (ml && rp && rt) rt.onclick = function () {
                var closed = rp.classList.toggle("collapsed");
                ml.classList.toggle("reports-collapsed", closed);
                this.textContent = closed ? "‹" : "›";
                setTimeout(function () {
                    window.dispatchEvent(new Event("resize"));
                    if (window.lageMap) window.lageMap.invalidateSize();
                }, 330);
            };

            var pause = document.getElementById("breakingPause");
            if (pause) pause.onclick = function () {
                var breaking = document.getElementById("breaking");
                if (!breaking) return;
                breaking.classList.toggle("paused");
                this.textContent = breaking.classList.contains("paused") ? "▶" : "Ⅱ";
            };

            console.log("LageInfo vollständig gestartet");
        })
        .catch(showError);
})();
</script>
